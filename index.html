<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📊 AI 决策工作台 · 综合客观因素分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 30px 0;
        }
        .card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: 600;
            font-size: 1.2rem;
        }
        .btn-primary {
            background: #6c5ce7;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #5a4bd1;
            transform: scale(1.02);
        }
        .btn-primary:disabled {
            background: #a29bfe;
        }
        .btn-success {
            border-radius: 30px;
        }
        .form-control {
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 12px 18px;
            resize: vertical;
        }
        .form-control:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .response-area {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px 24px;
            min-height: 150px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.7;
            position: relative;
        }
        .response-area .ai-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6c757d;
        }
        .response-area .ai-content {
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .badge-ai {
            background: #6c5ce7;
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .footer {
            color: #6c757d;
            font-size: 0.85rem;
            margin-top: 30px;
            text-align: center;
        }
        .copy-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            color: #6c757d;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .copy-btn:hover {
            color: #6c5ce7;
        }
        .history-item {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 4px solid #6c5ce7;
            cursor: pointer;
            transition: 0.2s;
        }
        .history-item:hover {
            background: #f1f3f5;
        }
        .history-item .question {
            font-weight: 500;
        }
        .history-item .time {
            font-size: 0.75rem;
            color: #868e96;
            float: right;
        }
        .history-item .summary {
            font-size: 0.9rem;
            color: #495057;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .history-empty {
            text-align: center;
            color: #adb5bd;
            padding: 20px 0;
        }
        #historyModal .modal-body {
            white-space: pre-wrap;
            line-height: 1.7;
            max-height: 60vh;
            overflow-y: auto;
        }
        .export-btn {
            border-radius: 30px;
        }
        @media (max-width: 576px) {
            .response-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- 主卡片 -->
                <div class="card">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-robot text-primary me-2"></i> AI 决策工作台</span>
                        <span class="badge-ai"><i class="fas fa-brain me-1"></i> 智谱 GLM-4-Flash</span>
                    </div>
                    <div class="card-body p-4">

                        <!-- 问题输入 -->
                        <div class="mb-3">
                            <label for="questionInput" class="form-label fw-semibold">
                                <i class="fas fa-question-circle me-1"></i> 你纠结的事情是什么？
                            </label>
                            <textarea class="form-control" id="questionInput" rows="3" 
                                      placeholder="例如：我该不该接受这个异地工作 offer？"></textarea>
                        </div>

                        <!-- 背景信息输入（新增） -->
                        <div class="mb-3">
                            <label for="contextInput" class="form-label fw-semibold">
                                <i class="fas fa-sliders-h me-1"></i> 补充背景信息（可选）
                            </label>
                            <textarea class="form-control" id="contextInput" rows="3" 
                                      placeholder="例如：我目前有房贷压力，孩子3岁，家庭需要稳定收入。该工作薪资涨幅30%但需搬迁。"></textarea>
                            <div class="form-text text-muted small">
                                <i class="fas fa-info-circle"></i> 尽量描述财务状况、家庭情况、时间限制、个人偏好等，AI 会将这些因素纳入分析。
                            </div>
                        </div>

                        <!-- 按钮组：分析 + 导出（新功能） -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button class="btn btn-primary" id="submitBtn" disabled>
                                <i class="fas fa-paper-plane me-2"></i> 帮我分析
                            </button>
                            <button class="btn btn-success export-btn" id="exportReportBtn" disabled>
                                <i class="fas fa-file-download me-2"></i> 导出报告
                            </button>
                        </div>

                        <!-- 分析结果 -->
                        <div class="mt-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="fw-bold mb-0"><i class="fas fa-lightbulb text-warning me-2"></i>AI 分析建议</h6>
                                <span id="statusBadge" class="badge bg-secondary">等待输入</span>
                            </div>
                            <div id="responseArea" class="response-area">
                                <div class="text-muted" style="font-size:0.95rem;">
                                    <i class="fas fa-comment-dots me-2"></i> 输入问题与背景，AI 将综合客观因素给出明确建议。
                                </div>
                                <button class="copy-btn" id="copyResultBtn" style="display:none;" title="复制结果">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- 历史记录卡片 -->
                <div class="card mt-4">
                    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-history me-2"></i> 分析历史记录</span>
                        <div>
                            <button class="btn btn-outline-danger btn-sm" id="clearHistoryBtn">
                                <i class="fas fa-trash-alt"></i> 清空
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-3" id="historyList">
                        <div class="history-empty">暂无历史记录</div>
                    </div>
                </div>

                <div class="footer">
                    <i class="fas fa-shield-alt me-1"></i> 数据仅存储在本地浏览器 &nbsp;·&nbsp; 由智谱AI提供免费模型支持
                </div>

            </div>
        </div>
    </div>

    <!-- 历史记录详情模态框 -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-alt me-2"></i>历史分析详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="historyModalBody">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" id="historyCopyBtn"><i class="fas fa-copy me-1"></i>复制</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  硬编码 API Key
            // ============================================================
            const DEFAULT_API_KEY = 'yourapikey';

            // DOM 元素
            const questionInput = document.getElementById('questionInput');
            const contextInput = document.getElementById('contextInput');
            const submitBtn = document.getElementById('submitBtn');
            const exportBtn = document.getElementById('exportReportBtn');
            const responseArea = document.getElementById('responseArea');
            const statusBadge = document.getElementById('statusBadge');
            const copyBtn = document.getElementById('copyResultBtn');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const historyModal = new bootstrap.Modal(document.getElementById('historyModal'));
            const historyModalBody = document.getElementById('historyModalBody');
            const historyCopyBtn = document.getElementById('historyCopyBtn');

            // 当前结果内容
            let currentResultText = '';
            let currentQuestion = '';
            let currentContext = '';

            // ============================================================
            //  历史记录操作（同前）
            // ============================================================
            function getHistory() {
                try {
                    return JSON.parse(localStorage.getItem('decisionHistory') || '[]');
                } catch { return []; }
            }

            function saveHistory(history) {
                localStorage.setItem('decisionHistory', JSON.stringify(history));
            }

            function addHistory(question, context, result) {
                const history = getHistory();
                history.unshift({
                    question: question,
                    context: context || '(无背景)',
                    result: result,
                    time: new Date().toLocaleString()
                });
                if (history.length > 50) history.pop();
                saveHistory(history);
                renderHistory();
            }

            function clearHistory() {
                if (confirm('确定要清空所有历史记录吗？')) {
                    saveHistory([]);
                    renderHistory();
                }
            }

            function renderHistory() {
                const history = getHistory();
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
                    return;
                }
                let html = '';
                history.forEach((item, index) => {
                    const summary = item.result.replace(/\n/g, ' ').substring(0, 80) + '...';
                    html += `
                                <div class="history-item" data-index="${index}">
                                    <div>
                                        <span class="question">${item.question}</span>
                                        <span class="time">${item.time}</span>
                                    </div>
                                    <div class="summary">${summary}</div>
                                </div>
                            `;
                });
                historyList.innerHTML = html;
                document.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const history = getHistory();
                        if (history[idx]) {
                            showHistoryDetail(history[idx]);
                        }
                    });
                });
            }

            function showHistoryDetail(item) {
                historyModalBody.innerHTML = `
                            <h6>问题：</h6>
                            <p>${item.question}</p>
                            <h6>背景信息：</h6>
                            <p>${item.context || '（无）'}</p>
                            <hr>
                            <h6>分析结果：</h6>
                            <div style="white-space:pre-wrap;">${item.result}</div>
                            <hr>
                            <small class="text-muted">分析时间：${item.time}</small>
                        `;
                historyModal._currentText = `问题：${item.question}\n背景：${item.context || '无'}\n\n分析结果：\n${item.result}`;
                historyModal.show();
            }

            historyCopyBtn.addEventListener('click', function() {
                const text = historyModal._currentText || '';
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    alert('已复制到剪贴板');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('已复制到剪贴板');
                });
            });

            clearHistoryBtn.addEventListener('click', clearHistory);

            // ============================================================
            //  复制当前结果
            // ============================================================
            copyBtn.addEventListener('click', function() {
                if (!currentResultText) return;
                navigator.clipboard.writeText(currentResultText).then(() => {
                    alert('已复制分析结果');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = currentResultText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('已复制分析结果');
                });
            });

            // ============================================================
            //  导出报告（新功能）
            // ============================================================
            exportBtn.addEventListener('click', function() {
                if (!currentResultText) {
                    alert('请先进行分析，再导出报告。');
                    return;
                }
                const report = `========================================
        决策分析报告
        生成时间：${new Date().toLocaleString()}
        ========================================

        【问题】
        ${currentQuestion}

        【背景信息】
        ${currentContext || '（未提供）'}

        【AI 分析建议】
        ${currentResultText}

        ========================================
        * 本报告由 AI 决策助手自动生成，仅供参考。
        `;
                // 下载为 .txt
                const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `决策报告_${new Date().toISOString().slice(0,10)}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            });

            // ============================================================
            //  输入框控制
            // ============================================================
            function checkInputs() {
                const hasQuestion = questionInput.value.trim().length > 0;
                submitBtn.disabled = !hasQuestion;
                // 导出按钮依赖结果，单独控制
            }
            questionInput.addEventListener('input', checkInputs);
            contextInput.addEventListener('input', checkInputs);
            checkInputs();

            questionInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (!submitBtn.disabled) {
                        handleAnalyze();
                    }
                }
            });

            submitBtn.addEventListener('click', handleAnalyze);

            // ============================================================
            //  核心分析函数（增强版）
            // ============================================================
            async function handleAnalyze() {
                const question = questionInput.value.trim();
                if (!question) return;
                const context = contextInput.value.trim();

                currentQuestion = question;
                currentContext = context;

                // 禁用按钮
                submitBtn.disabled = true;
                exportBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> 分析中...';
                statusBadge.textContent = '⏳ AI 思考中';
                statusBadge.className = 'badge bg-warning text-dark';
                copyBtn.style.display = 'none';
                currentResultText = '';

                responseArea.innerHTML = `
                            <div class="ai-loading">
                                <i class="fas fa-spinner fa-spin text-primary"></i>
                                <span>AI 正在综合分析客观因素（经济、天气、社会、个人情况等）...</span>
                            </div>
                        `;

                try {
                    // 构建 Prompt —— 强调客观因素和明确建议
                    const prompt = `
                你是一个专业的决策顾问。用户面临以下纠结：

                问题：${question}
                ${context ? `\n用户提供的背景信息：${context}` : ''}

                请从以下几个方面进行深度分析，并综合考虑当前可预见的客观因素（如经济环境、社会趋势、天气状况、个人财务状况、家庭因素、时间紧迫度等）：

                1. 利弊分析（至少各三点）
                2. 风险评估（潜在风险及应对措施）
                3. 短期与长期影响
                4. 结合上述客观因素，给出最终明确的建议（必须使用 "我建议你选择..." 的句式）

                要求：
                - 语气温和、理性、富有同理心。
                - 建议具体、可操作。
                - 结构清晰，用中文回复。
                - 总字数控制在 700-1000 字。
                `;

                    const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${DEFAULT_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: 'glm-4-flash',
                            messages: [
                                { role: 'system', content: '你是一位富有同理心的专业决策顾问，擅长综合各种客观因素给出明确建议。' },
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.7,
                            max_tokens: 1600
                        })
                    });

                    if (!response.ok) {
                        let errMsg = `API 请求失败 (${response.status})`;
                        try {
                            const errData = await response.json();
                            if (errData.error && errData.error.message) {
                                errMsg = errData.error.message;
                            }
                        } catch (e) {}
                        throw new Error(errMsg);
                    }

                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content || '（AI 未返回有效内容）';

                    currentResultText = content;

                    responseArea.innerHTML = `
                                <div class="ai-content">
                                    ${content.replace(/\n/g, '<br>')}
                                </div>
                                <button class="copy-btn" id="copyResultBtn" style="display:block;" title="复制结果">
                                    <i class="fas fa-copy"></i>
                                </button>
                            `;
                    document.getElementById('copyResultBtn').addEventListener('click', function() {
                        if (!currentResultText) return;
                        navigator.clipboard.writeText(currentResultText).then(() => {
                            alert('已复制分析结果');
                        }).catch(() => {
                            const textarea = document.createElement('textarea');
                            textarea.value = currentResultText;
                            document.body.appendChild(textarea);
                            textarea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textarea);
                            alert('已复制分析结果');
                        });
                    });

                    statusBadge.textContent = '✅ 分析完成';
                    statusBadge.className = 'badge bg-success';
                    exportBtn.disabled = false;

                    // 保存历史
                    addHistory(question, context, content);

                } catch (error) {
                    console.error('AI 分析失败:', error);
                    let errorMsg = error.message || '未知错误';
                    if (errorMsg.includes('401') || errorMsg.includes('403') || errorMsg.includes('invalid')) {
                        errorMsg = 'API Key 无效或已过期，请检查或更换 Key。';
                    }
                    responseArea.innerHTML = `
                                <div class="alert alert-danger mb-0">
                                    <i class="fas fa-exclamation-triangle me-2"></i>
                                    <strong>分析失败：</strong> ${errorMsg}
                                    <br><small class="text-muted">提示：请确认 API Key 正确且账户有剩余额度。</small>
                                </div>
                            `;
                    statusBadge.textContent = '❌ 失败';
                    statusBadge.className = 'badge bg-danger';
                    exportBtn.disabled = true;
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> 帮我分析';
                    // 重新检查按钮状态
                    checkInputs();
                }
            }

            // ============================================================
            //  初始化
            // ============================================================
            renderHistory();
            exportBtn.disabled = true;

        })();
    </script>

</body>
</html>
